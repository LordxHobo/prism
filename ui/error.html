<html lang="en">
<head>
<meta charset="utf-8">
<title>Problem loading page</title>
<script src="pages.js"></script>
<link rel="stylesheet" href="pages.css">
<style>
  main { padding-top: 14vh; }
  .icon { font-size: 44px; line-height: 1; margin-bottom: 18px; }
  .url { word-break: break-all; }
  details { margin-top: 28px; font-size: 13px; }
  summary { cursor: pointer; color: var(--text-dim); }
  .actions { margin-top: 24px; display: flex; gap: 10px; }
</style>
</head>
<body>
<main>
  <div class="icon" id="icon" aria-hidden="true">&#x26A0;&#xFE0F;</div>
  <h1 id="heading">Can't reach this page</h1>
  <p class="dim" id="summary"></p>
  <ul class="notes dim" id="tips"></ul>
  <div class="actions">
    <button class="button" id="retry">Try again</button>
  </div>
  <details>
    <summary>Technical details</summary>
    <p class="dim" id="details"></p>
  </details>
</main>
<script>
'use strict';
const params = new URLSearchParams(location.search);
const kind = params.get('kind') || 'network';
const url = params.get('url') || '';
const message = params.get('message') || '';
const code = params.get('code') || '';

let host = url;
try { host = new URL(url).host || url; } catch (e) { /* keep as-is */ }

const $ = (id) => document.getElementById(id);
const tips = [];

if (kind === 'blocked') {
  const owner = params.get('owner') || 'an extension';
  document.title = 'Blocked: ' + host;
  $('icon').textContent = '\u{1F6E1}\uFE0F';
  $('heading').textContent = host + ' is blocked';
  $('summary').textContent = owner + ' blocks this site because it\u2019s on one of its ad, tracker or malware lists.';
  if (owner === 'Prism Shields') {
    tips.push('If you trust this site, allow it: Prism Shields won\u2019t block it again. You can undo this in Settings \u2192 Shields.');
    const allow = document.createElement('button');
    allow.className = 'button secondary';
    allow.textContent = 'Allow ' + host;
    allow.addEventListener('click', () => {
      const hostname = (() => { try { return new URL(url).hostname; } catch (e) { return host; } })();
      if (window.prompt('prism:allowSite\n' + hostname) === 'true') location.href = url;
    });
    $('retry').after(allow);
  } else {
    tips.push('If you trust this site, turn off the filter list that blocks it (Extensions page \u2192 Details), or turn the extension off.');
  }
  $('retry').textContent = 'Go back';
  $('retry').addEventListener('click', (event) => { event.stopImmediatePropagation(); history.back(); }, true);
  $('details').textContent = 'Blocked by ' + owner + ' \u2014 ' + url;
} else if (kind === 'https') {
  document.title = 'Not secure: ' + host;
  $('icon').textContent = '\u{1F513}';
  $('heading').textContent = host + ' doesn\u2019t offer a secure connection';
  $('summary').textContent = 'Prism tried the secure (HTTPS) version of this site, but it didn\u2019t work. On the unsecured version, others on your network could see or change what you send and receive.';
  tips.push('Don\u2019t enter passwords or payment details on the unsecured version.');
  tips.push('To stop being asked, turn HTTPS off for this site in the Shields panel, or choose \u201cHTTPS first\u201d in Settings \u2192 Privacy.');
  const go = document.createElement('button');
  go.className = 'button secondary';
  go.textContent = 'Continue to ' + host + ' (not secure)';
  go.addEventListener('click', () => {
    if (window.prompt('prism:allowHttp\n' + url) === 'true') location.href = url;
  });
  $('retry').after(go);
  $('retry').textContent = 'Go back';
  $('retry').addEventListener('click', (event) => { event.stopImmediatePropagation(); history.back(); }, true);
  $('details').textContent = 'HTTPS only \u2014 ' + url;
} else if (kind === 'crash') {
  document.title = 'Page crashed';
  $('icon').textContent = '\u{1F4A5}';
  $('heading').textContent = 'This page crashed';
  $('summary').textContent = 'Something went wrong while showing this page. Your other tabs are fine.';
  tips.push('Reload the page to try again.');
  tips.push('If it keeps happening, the page may not work with Prism yet.');
  $('details').textContent = 'Web process ended (reason ' + code + ').';
} else if (code === '60') {
  // curl: the certificate couldn't be verified.
  document.title = 'Certificate not trusted: ' + host;
  $('icon').textContent = '\u{1F512}';
  $('heading').textContent = 'Prism can\u2019t verify ' + host + '\u2019s certificate';
  $('summary').textContent = 'The site\u2019s security certificate isn\u2019t signed by an authority Windows trusts, so Prism didn\u2019t open it.';
  tips.push('Check that your PC\u2019s date and time are right.');
  tips.push('Run Windows Update: it keeps the list of trusted certificate authorities current.');
  tips.push('If this happens on a network you don\u2019t control (work, school, hotel), it may be inspecting secure connections.');
  $('details').textContent = (message ? message + ' ' : '') + '(error ' + code + ')' + (url ? ' \u2014 ' + url : '');
} else {
  document.title = host ? 'Can’t reach ' + host : 'Can’t reach this page';
  $('heading').textContent = host ? 'Can’t reach ' + host : 'Can’t reach this page';
  $('summary').textContent = message || 'The page didn’t load.';
  tips.push('Check the address for typos.');
  tips.push('Check your internet connection.');
  tips.push('If you use a VPN or firewall, make sure it allows Prism.');
  $('details').textContent = (message ? message + ' ' : '') + '(error ' + code + ')' + (url ? ' — ' + url : '');
}

for (const tip of tips) {
  const item = document.createElement('li');
  item.textContent = tip;
  $('tips').appendChild(item);
}

$('retry').addEventListener('click', () => {
  if (url) location.replace(url);
  else history.back();
});
</script>
</body>
</html>
