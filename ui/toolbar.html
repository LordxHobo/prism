<html lang="en">
<head>
<meta charset="utf-8">
<title>Prism toolbar</title>
<link rel="stylesheet" href="toolbar.css">
</head>
<body>
  <div id="tabstrip">
    <div id="tabs" role="tablist"></div>
    <button id="newtab" class="icon" title="New tab (Ctrl+T)" aria-label="New tab">
      <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
    </button>
  </div>

  <div id="navbar">
    <button id="back" class="icon" title="Back (Alt+Left)" aria-label="Back">
      <svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg>
    </button>
    <button id="forward" class="icon" title="Forward (Alt+Right)" aria-label="Forward">
      <svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg>
    </button>
    <button id="reload" class="icon" title="Reload (F5)" aria-label="Reload">
      <svg class="reload" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6"/><path d="M12 1.8v3h-3"/></svg>
      <svg class="stop" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>

    <form id="addressform" autocomplete="off">
      <button id="shield" type="button" class="icon small" title="Prism Shields" aria-label="Prism Shields">
        <svg viewBox="0 0 16 16"><path d="M8 1.5l5 2v4c0 3.2-2.1 5.6-5 7-2.9-1.4-5-3.8-5-7v-4z"/><path d="M5.8 8l1.6 1.6L10.4 6.4"/></svg>
      </button>
      <input id="address" type="text" spellcheck="false" placeholder="Search or enter address" aria-label="Address and search bar">
      <button id="star" type="button" class="icon small" hidden title="Bookmark this page (Ctrl+D)" aria-label="Bookmark this page">
        <svg viewBox="0 0 16 16"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg>
      </button>
      <button id="addExtension" type="button" hidden title="Install this extension in Prism">Add to Prism</button>
      <div id="toast" role="status" aria-live="polite"></div>
    </form>

    <div id="actions" role="toolbar" aria-label="Extension buttons"></div>
    <button id="extensions" class="icon" title="Extensions (Ctrl+Shift+E)" aria-label="Extensions">
      <svg viewBox="0 0 16 16"><path d="M6 2.5a1.5 1.5 0 0 1 3 0V4h3v3h-1.5a1.5 1.5 0 0 0 0 3H12v3H9v-1.5a1.5 1.5 0 0 0-3 0V13H3v-3h1.5a1.5 1.5 0 0 0 0-3H3V4h3z"/></svg>
    </button>

    <button id="menu" class="icon" title="Menu" aria-label="Menu">
      <svg viewBox="0 0 16 16" class="filled"><circle cx="3" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="13" cy="8" r="1.4"/></svg>
    </button>
    <div id="progress"></div>
  </div>

  <div id="bookmarksbar" class="row" hidden role="toolbar" aria-label="Bookmarks bar">
    <div id="bookmarkItems"></div>
    <span id="bookmarksEmpty">Bookmark pages with the star in the address bar (Ctrl+D) to see them here.</span>
    <button id="bookmarkMore" class="icon small" hidden title="More bookmarks" aria-label="More bookmarks">
      <svg viewBox="0 0 16 16"><path d="M4 4l4 4-4 4M8.5 4l4 4-4 4"/></svg>
    </button>
  </div>

  <div id="infobar" class="row" hidden role="alertdialog" aria-labelledby="infoText">
    <svg id="infoIcon" viewBox="0 0 16 16"></svg>
    <span id="infoText"></span>
    <button id="permAllow" class="pill primary">Allow</button>
    <button id="permBlock" class="pill">Block</button>
    <button id="permDismiss" class="icon small" title="Not now" aria-label="Not now">
      <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </div>

  <div id="findbar" class="row" hidden role="search">
    <div id="findfield">
      <input id="findInput" type="text" spellcheck="false" placeholder="Find in page" aria-label="Find in page">
      <span id="findCount" role="status"></span>
    </div>
    <button id="findPrev" class="icon small" title="Previous match (Shift+Enter)" aria-label="Previous match">
      <svg viewBox="0 0 16 16"><path d="M4 10l4-4 4 4"/></svg>
    </button>
    <button id="findNext" class="icon small" title="Next match (Enter)" aria-label="Next match">
      <svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg>
    </button>
    <button id="findClose" class="icon small" title="Close (Esc)" aria-label="Close find bar">
      <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </div>

  <script src="toolbar.js"></script>
</body>
</html>
