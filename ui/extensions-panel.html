<html lang="en">
<head>
<meta charset="utf-8">
<title>Extensions</title>
<script src="pages.js"></script>
<link rel="stylesheet" href="pages.css">
<link rel="stylesheet" href="extensions-panel.css">
</head>
<body>
<div class="panel" id="panel">
  <header>
    <h1>Extensions</h1>
    <button class="close" id="close" title="Close" aria-label="Close">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </header>
  <div id="groups"></div>
  <p class="empty dim" id="empty" hidden>No extensions with buttons. Add some from the Chrome Web Store or Firefox Add-ons.</p>
  <footer>
    <button class="manage" id="manage">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
      Manage extensions
    </button>
  </footer>
</div>
<script src="extensions-panel.js"></script>
</body>
</html>
