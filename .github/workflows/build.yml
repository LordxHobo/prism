# Builds Prism on GitHub's Windows servers and packages a ready-to-run zip
# (Prism.exe + interface + WebKit runtime + Prism Shields). Download it from the run's
# "Artifacts" section. Pushing a tag like v0.1.0 also publishes a Release.

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      update_webkit:
        description: 'Use the newest WebKit build instead of the one in webkit.lock'
        type: boolean
        default: false

permissions:
  contents: write # needed to publish Releases from tags

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up the Visual Studio C++ compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shields/target
          key: shields-${{ hashFiles('shields/Cargo.lock') }}

      - name: Build Prism
        shell: cmd
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Work out the WebKit version
        id: webkit
        shell: pwsh
        run: |
          $key = 'none'
          if (Test-Path webkit.lock) { $key = (Get-Content webkit.lock -Raw | ConvertFrom-Json).revision }
          "revision=$key" >> $env:GITHUB_OUTPUT

      - name: Cache the WebKit download
        if: steps.webkit.outputs.revision != 'none' && inputs.update_webkit != true
        uses: actions/cache@v4
        with:
          path: .cache/webkit-*.zip
          key: webkit-${{ steps.webkit.outputs.revision }}

      - name: Download the WebKit runtime
        shell: pwsh
        run: |
          if ('${{ inputs.update_webkit }}' -eq 'true') {
            ./scripts/fetch-webkit.ps1 -Update
          } else {
            ./scripts/fetch-webkit.ps1
          }

      # After the WebKit download, which clears out dist\.
      - name: Build Prism Shields (adblock-rust + uBlock Origin's scriptlets)
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-msvc
          ./scripts/build-shields.ps1
          if (-not (Test-Path dist/prism_shields.dll)) { throw 'prism_shields.dll is missing' }
          if (-not (Test-Path dist/shields/scriptlets.json)) { throw 'scriptlets.json is missing' }
          if (-not (Test-Path dist/PrismBundle.dll)) { throw 'PrismBundle.dll is missing' }

      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path src/Version.h -Pattern 'PRISM_VERSION_STRING "(.+)"').Matches[0].Groups[1].Value
          $name = "Prism-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Recurse dist "package/$name"
          Copy-Item LICENSE, README.md, webkit.lock "package/$name/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "package/$name" -DestinationPath "package/$name.zip"
          "PACKAGE=$name" >> $env:GITHUB_ENV

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: package/${{ env.PACKAGE }}
          retention-days: 30

      # Only when webkit.lock is new or changed (no file committed yet, or the
      # "newest WebKit" option was used); otherwise it's the committed copy.
      - name: Check whether webkit.lock changed
        id: lock
        shell: pwsh
        run: |
          $changed = 'false'
          if (Test-Path webkit.lock) {
            git ls-files --error-unmatch webkit.lock 2>$null | Out-Null
            if ($LASTEXITCODE -ne 0) { $changed = 'true' }
            else {
              git diff --quiet -- webkit.lock
              if ($LASTEXITCODE -ne 0) { $changed = 'true' }
            }
          }
          "changed=$changed" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Upload webkit.lock (pin it by committing this file)
        if: steps.lock.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: webkit.lock
          path: webkit.lock

      - name: Publish a Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: package/${{ env.PACKAGE }}.zip
          generate_release_notes: true
