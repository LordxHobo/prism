<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<title>New Tab</title>
<script src="pages.js"></script>
<link rel="stylesheet" href="pages.css">
<style>
  main {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-top: 0;
    padding-bottom: 12vh;
    text-align: center;
  }
  h1 {
    font-size: 26px;
    margin: 14px 0 22px;
  }
  form {
    width: 100%;
    max-width: 560px;
  }
  input {
    width: 100%;
    height: 48px;
    padding: 0 20px;
    border-radius: 24px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 16px;
    outline: none;
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .privacy {
    margin-top: 26px;
    font-size: 13px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  body.has-background {
    background-size: cover;
    background-position: center;
  }
  body.has-background main::before {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.45));
    z-index: -1;
  }
  body.has-background h1,
  body.has-background .privacy {
    color: #fff;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
  }
  .shortcuts {
    display: grid;
    grid-template-columns: repeat(4, 112px);
    gap: 12px;
    margin-top: 30px;
    justify-content: center;
  }
  @media (max-width: 560px) {
    .shortcuts { grid-template-columns: repeat(3, 100px); }
  }
  .shortcut {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 14px 8px 10px;
    border-radius: 14px;
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
    background: color-mix(in srgb, var(--surface) 80%, transparent);
    border: 1px solid var(--border);
  }
  .shortcut:hover {
    background: var(--surface-hover);
  }
  .shortcut .icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    background: var(--bg);
    border: 1px solid var(--border);
    font-weight: 650;
    font-size: 16px;
    text-transform: uppercase;
  }
  .shortcut .icon img {
    width: 24px;
    height: 24px;
    object-fit: contain;
  }
  .shortcut .name {
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .shortcut .remove {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 22px;
    height: 22px;
    border: 0;
    border-radius: 6px;
    background: none;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
  }
  .shortcut:hover .remove {
    opacity: 1;
  }
  .shortcut .remove:hover {
    background: var(--surface);
    color: var(--text);
  }
  .privacy svg {
    width: 16px;
    height: 16px;
    flex: none;
    fill: none;
    stroke: var(--good);
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
</style>
</head>
<body>
<main>
  <img class="logo" src="prism.svg" alt="">
  <h1>Prism</h1>
  <form id="search" autocomplete="off">
    <input id="query" type="search" placeholder="Search privately or enter an address" aria-label="Search or enter an address">
  </form>
  <nav class="shortcuts" id="shortcuts" aria-label="Shortcuts"></nav>
  <p class="privacy">
    <svg viewBox="0 0 16 16"><path d="M8 1.5l5 2v4c0 3.2-2.1 5.6-5 7-2.9-1.4-5-3.8-5-7v-4z"/><path d="M5.8 8l1.6 1.6L10.4 6.4"/></svg>
    Trackers limited and third-party cookies blocked. Prism never collects your data.
  </p>
</main>
<script>
'use strict';
function ask(command, argument = '') {
  const answer = window.prompt('prism:' + command + '\n' + argument);
  try {
    return answer === null || answer === undefined ? null : JSON.parse(answer);
  } catch (e) {
    return null;
  }
}

function hostOf(url) {
  try {
    return new URL(url).hostname.replace(/^www\./, '');
  } catch (e) {
    return url;
  }
}

function renderShortcuts(data) {
  const container = document.getElementById('shortcuts');
  container.textContent = '';
  if (!data) return;
  if (data.background) {
    document.body.classList.add('has-background');
    document.body.style.backgroundImage = 'url("' + data.background.replace(/"/g, '%22') + '")';
  }
  for (const shortcut of data.shortcuts || []) {
    const link = document.createElement('a');
    link.className = 'shortcut';
    link.href = shortcut.url;
    link.title = (shortcut.title ? shortcut.title + '\n' : '') + shortcut.url;
    const icon = document.createElement('span');
    icon.className = 'icon';
    const letter = hostOf(shortcut.url)[0] || '•';
    if (shortcut.icon) {
      const img = document.createElement('img');
      img.alt = '';
      img.src = shortcut.icon;
      img.addEventListener('error', () => { icon.textContent = letter; });
      icon.appendChild(img);
    } else {
      icon.textContent = letter;
    }
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = data.mode === 'bookmarks' && shortcut.title ? shortcut.title : hostOf(shortcut.url);
    link.append(icon, name);
    link.addEventListener('click', (event) => {
      event.preventDefault();
      ask('open', shortcut.url + '\n' + (event.ctrlKey || event.button === 1 ? 'background' : 'current'));
    });
    if (data.mode === 'top') {
      const remove = document.createElement('button');
      remove.className = 'remove';
      remove.title = 'Don\'t show this site';
      remove.setAttribute('aria-label', 'Don\'t show this site');
      remove.textContent = '×';
      remove.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        renderShortcuts(ask('hide', hostOf(shortcut.url)));
      });
      link.appendChild(remove);
    }
    container.appendChild(link);
  }
}
renderShortcuts(ask('data'));
const search = new URLSearchParams(location.search).get('search') || 'https://duckduckgo.com/?q=%s';
document.getElementById('search').addEventListener('submit', (event) => {
  event.preventDefault();
  const text = document.getElementById('query').value.trim();
  if (!text) return;
  const looksLikeAddress = !/\s/.test(text) && /^([a-z][a-z0-9+.-]*:\/\/|localhost|([a-z0-9-]+\.)+[a-z]{2,})/i.test(text);
  if (looksLikeAddress)
    location.href = /^[a-z][a-z0-9+.-]*:\/\//i.test(text) ? text : 'https://' + text;
  else
    location.href = search.replace('%s', encodeURIComponent(text));
});
</script>
</body>
</html>
