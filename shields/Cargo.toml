[package]
name = "prism_shields"
version = "0.5.0"
edition = "2021"
license = "MPL-2.0"
description = "Prism Shields: a C API around Brave's adblock-rust engine for the Prism browser"
publish = false

[lib]
# A DLL with a plain C API. Prism loads it at runtime, like WebKit.
crate-type = ["cdylib"]

[dependencies]
# Brave's ad-blocking engine (MPL-2.0). Not "single-thread": Prism builds the
# engine on a worker thread and then uses it on the UI thread.
adblock = { version = "0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
